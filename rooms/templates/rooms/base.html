<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Django Code{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #090d16; color: #f8fafc; margin: 0; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col font-sans bg-[#090d16] select-none md:select-auto">
    <header class="border-b border-[#1e293b] bg-[#0d1320] sticky top-0 z-50">
        <div class="px-3 md:px-4 h-12 md:h-13 flex items-center justify-between">
            <div class="flex items-center space-x-2 md:space-x-3 overflow-hidden">
                <a href="{% url 'rooms:room_list' %}" class="flex items-center space-x-1.5 group flex-shrink-0">
                    <span class="text-emerald-400 font-black text-base md:text-lg tracking-wider group-hover:text-emerald-300 transition">DJANGO</span>
                    <span class="text-slate-400 text-[10px] px-1.5 py-0.5 rounded bg-slate-800/80 border border-slate-700 font-mono">CODE</span>
                </a>
                <div class="text-xs md:text-sm text-slate-400 flex items-center space-x-2 truncate">
                    {% block nav_extra %}{% endblock %}
                </div>
            </div>
            <div class="flex items-center space-x-1.5 md:space-x-2.5 text-xs flex-shrink-0">
                {% block nav_actions %}{% endblock %}
            </div>
        </div>
    </header>

    <main class="flex-1 flex flex-col overflow-hidden">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
